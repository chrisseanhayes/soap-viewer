<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-50">

    <!-- svg-pan-zoom must load before mermaid-init (not a module, so no import available) -->

    <script type="module" src="./js/mermaid-init.js"></script>

    <!-- App root — populated by app.js after data loads -->
    <div id="app-root">
        <div class="text-center text-slate-400 py-20">Loading content...</div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
